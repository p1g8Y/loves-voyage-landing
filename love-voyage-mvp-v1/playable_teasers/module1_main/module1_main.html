<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boing · 主畫面</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#a8d4e8;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  font-family:'Noto Serif TC',serif;
}

/* ── 9:16 Phone ── */
#phone{
  position:relative;
  width:min(390px,100vw);
  height:min(844px,calc(100vw * 16/9));
  max-height:100vh;
  border-radius:40px;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.1);
}

/* ── Ocean BG ── */
#bg{
  position:absolute;inset:0;
  background:url('../../shared_assets/bg_ocean.png') center/cover no-repeat;
  transform:scale(1.19);
  transform-origin:center;
  will-change:transform;
  transition:transform .06s linear;
}

/* ═══════════════════════════════════
   TOP BAR
═══════════════════════════════════ */
#topbar{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:12px 13px 0;
  z-index:20;
  pointer-events:none;
}

/* ── Left: Hanging Wooden Sign (image) ── */
.hanging-sign{
  pointer-events:all;
  display:flex;flex-direction:column;align-items:flex-start;
}
.sign-img-wrap{
  position:relative;
  display:inline-block;
}
.ship-name-plate{
  position:absolute;
  left:80px;
  top:50%;
  transform:translateY(calc(-50% + 5px));
  font-family:'Noto Serif TC',serif;
  font-size:.68rem;
  color:#fde8b0;
  letter-spacing:.1em;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
  white-space:nowrap;
  pointer-events:none;
  max-width:72px;
  overflow:hidden;
  text-overflow:ellipsis;
}
.hanging-sign-img{
  height:91px;
  object-fit:contain;
  display:block;
  transform-origin:top left;
  filter:drop-shadow(0 5px 14px rgba(0,0,0,.38));
}
/* CSS fallback (shown only if image fails) */
.hanging-sign-css{
  display:none;
  flex-direction:column;align-items:flex-start;
  filter:drop-shadow(0 5px 12px rgba(0,0,0,.35));
}
.sign-rods{display:flex;gap:40px;padding:0 11px;}
.sign-rod{width:3px;height:10px;background:linear-gradient(180deg,#4a280a,#c07840,#4a280a);border-radius:2px;}
.sign-body{display:flex;align-items:center;}
.medallion{
  width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle at 36% 33%,#e0b860 0%,#9a6028 55%,#5c3010 100%);
  border:3.5px solid #3d1e06;
  box-shadow:0 4px 12px rgba(0,0,0,.45),inset 0 2px 4px rgba(255,220,100,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;position:relative;z-index:1;flex-shrink:0;
}
.medallion::before{content:'';position:absolute;inset:6px;border-radius:50%;border:1.5px solid rgba(255,220,100,.4);}
.plaque{
  background:linear-gradient(180deg,#d4a050 0%,#9a5e28 45%,#c09040 100%);
  border:2.5px solid #3d1e06;border-left:none;
  border-radius:0 10px 10px 0;
  padding:6px 16px 6px 18px;margin-left:-6px;
  box-shadow:3px 4px 10px rgba(0,0,0,.32),inset 0 1.5px rgba(255,255,255,.18);
  display:flex;align-items:center;min-width:92px;
}
.plaque-text{font-size:.74rem;color:#fde8b0;letter-spacing:.12em;text-shadow:0 1px 3px rgba(0,0,0,.55);white-space:nowrap;}

/* ── Right: Coin Display (image) ── */
.coin-display{
  pointer-events:all;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.32));
  margin-top:8px;
}
.coin-img-wrap{
  position:relative;
  display:inline-block;
}
.coin-bar-img{
  height:50px;
  width:auto;
  object-fit:contain;
  display:block;
}
.coin-num-overlay{
  position:absolute;
  right:16px;top:50%;
  transform:translateY(-50%);
  font-family:'Noto Serif TC',serif;
  font-size:.9rem;color:#5a2e0a;font-weight:700;letter-spacing:.04em;
  pointer-events:none;
  text-shadow:0 1px 3px rgba(255,255,255,.6);
}
/* CSS fallback (shown if image fails) */
.coin-fallback{
  display:none;align-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(248,238,215,.92));
  border:1.5px solid rgba(255,255,255,.95);border-radius:99px;
  padding:6px 14px;gap:5px;
  box-shadow:2px 3px 8px rgba(0,0,0,.2);
}
.coin-fallback .cn{font-size:.84rem;color:#5a2e0a;font-weight:700;}
.coin-fallback .cl{font-size:.62rem;color:#8a5820;letter-spacing:.05em;}

/* ═══════════════════════════════════
   SAILBOAT  (center, enlarged)
═══════════════════════════════════ */
#ship-wrap{
  position:absolute;
  top:45%;left:50%;
  transform:translate(-50%,-50%);
  width:127%;max-width:490px;
  will-change:transform;
  z-index:5;
}
#ship-img{
  width:100%;display:block;
  filter:drop-shadow(0 18px 35px rgba(0,0,0,.22));
  animation:shipBob 4.2s ease-in-out infinite;
}
@keyframes shipBob{
  0%,100%{transform:translateY(0) rotate(-.7deg);}
  50%    {transform:translateY(10px) rotate(.7deg);}
}

/* ═══════════════════════════════════
   BOTTOM STICKER BUTTONS
═══════════════════════════════════ */
.stk{
  position:absolute;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;background:transparent;border:none;padding:0;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1);
  z-index:15;
}
/* All sticker images: same bounding box so visual sizes match */
.stk img{
  width:88px;height:88px;
  object-fit:contain;display:block;
  filter:drop-shadow(0 7px 14px rgba(0,0,0,.28));
}
.stk-tag{
  background:rgba(255,255,255,.78);
  border:1px solid rgba(255,255,255,.95);border-radius:99px;
  padding:3px 11px;font-size:.63rem;color:#5a3010;
  letter-spacing:.09em;box-shadow:0 2px 6px rgba(0,0,0,.15);
  white-space:nowrap;
}
.stk:active{transform:scale(.86) !important;}

/* ── Idle float animations (rotation baked in per button) ── */
@keyframes floatJournal{
  0%,100%{transform:rotate(3deg) translateY(0);}
  50%    {transform:rotate(3deg) translateY(-4px);}
}
@keyframes floatWhale{
  0%,100%{transform:rotate(-5deg) translateY(0);}
  50%    {transform:rotate(-5deg) translateY(-4px);}
}
@keyframes floatMap{
  0%,100%{transform:rotate(7deg) translateY(0);}
  50%    {transform:rotate(7deg) translateY(-4px);}
}

/* Journal – bottom-center, near bottom */
#stk-journal{
  left:calc(50% - 44px);bottom:5%;
  animation:floatJournal 3.6s ease-in-out infinite;
}

/* Whale – bottom-left */
#stk-whale{
  left:5%;bottom:13%;
  animation:floatWhale 3.6s ease-in-out infinite;
}
.whale-bar{
  background:rgba(255,255,255,.75);
  border:1px solid rgba(255,255,255,.9);border-radius:99px;
  padding:3px 12px;font-size:.63rem;color:#3a6888;
  letter-spacing:.08em;box-shadow:0 2px 6px rgba(0,0,0,.14);
  white-space:nowrap;margin-top:2px;
}

/* Map – bottom-right */
#stk-map{
  right:4%;bottom:11%;
  animation:floatMap 3.6s ease-in-out infinite;
}

/* ═══════════════════════════════════
   TOAST
═══════════════════════════════════ */
#toast{
  position:absolute;top:22%;left:50%;
  transform:translateX(-50%) translateY(-10px);
  background:rgba(18,10,4,.84);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,215,130,.42);
  border-radius:99px;padding:11px 24px;
  color:#fde8b8;font-size:.78rem;letter-spacing:.09em;
  white-space:nowrap;
  box-shadow:0 10px 28px rgba(0,0,0,.32);
  opacity:0;pointer-events:none;
  transition:opacity .32s,transform .38s cubic-bezier(.34,1.56,.64,1);
  z-index:30;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* sparkle */
.sp{
  position:absolute;pointer-events:none;
  width:7px;height:7px;border-radius:50%;
  animation:spA .7s ease-out forwards;z-index:40;
}
@keyframes spA{
  0%  {opacity:1;transform:translate(0,0) scale(1);}
  100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(0);}
}
</style>
</head>
<body>
<div id="phone">

  <div id="bg"></div>

  <!-- ── Top Bar ── -->
  <div id="topbar">

    <!-- Left: hanging wooden sign (image) -->
    <div class="hanging-sign">
      <div class="sign-img-wrap">
        <img class="hanging-sign-img"
             src="../../shared_assets/木頭懸掛招牌.png"
             alt="Boing"
             onerror="this.style.display='none';this.parentElement.nextElementSibling.style.display='flex'">
        <span class="ship-name-plate">愛的小船</span>
      </div>
      <!-- CSS fallback -->
      <div class="hanging-sign-css">
        <div class="sign-rods"><div class="sign-rod"></div><div class="sign-rod"></div></div>
        <div class="sign-body">
          <div class="medallion">⛵</div>
          <div class="plaque"><span class="plaque-text">愛的小船</span></div>
        </div>
      </div>
    </div>

    <!-- Right: coin display (image) -->
    <div class="coin-display">
      <div class="coin-img-wrap">
        <img class="coin-bar-img" src="../../shared_assets/默契幣數量顯示欄.png" alt="默契值"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="coin-fallback">
          <span class="cn">128</span><span class="cl">默契值</span>
        </div>
        <span class="coin-num-overlay">128</span>
      </div>
    </div>
  </div>

  <!-- ── Central Sailboat ── -->
  <div id="ship-wrap">
    <img id="ship-img" src="../../shared_assets/船隻縮圖.png" alt="帆船"
         onerror="this.outerHTML='<div style=font-size:10rem;text-align:center;filter:drop-shadow(0 12px 24px rgba(0,0,0,.2))>⛵</div>'">
  </div>

  <!-- ── Sticker Buttons ── -->

  <!-- Journal (bottom-left) -->
  <button class="stk" id="stk-journal" onclick="go(this,'即將開啟航海日誌…')">
    <img src="./assets/btn_journal.png" alt="航海日誌"
         onerror="this.outerHTML='<span style=font-size:3.5rem;filter:drop-shadow(0 6px 12px rgba(0,0,0,.25))>📖</span>'">
    <span class="stk-tag">航海日誌</span>
  </button>

  <!-- Whale (bottom-center) -->
  <button class="stk" id="stk-whale" onclick="go(this,'喚醒波音夥伴…')">
    <img src="../../shared_assets/小鯨魚.png" alt="波音"
         onerror="this.outerHTML='<span style=font-size:3.2rem;filter:drop-shadow(0 6px 12px rgba(0,0,0,.2))>🐋</span>'">
    <span class="whale-bar">波音</span>
  </button>

  <!-- Map (bottom-right) -->
  <button class="stk" id="stk-map" onclick="go(this,'正在展開航海地圖…')">
    <img src="./assets/btn_map.png" alt="地圖星象"
         onerror="this.outerHTML='<span style=font-size:3.5rem;filter:drop-shadow(0 6px 12px rgba(0,0,0,.2))>🗺️</span>'">
    <span class="stk-tag">地圖星象</span>
  </button>

  <!-- Toast -->
  <div id="toast"></div>

</div><!-- /phone -->

<script>
  const phone = document.getElementById('phone');
  const bg    = document.getElementById('bg');
  const sw    = document.getElementById('ship-wrap');
  const toast = document.getElementById('toast');
  let toastT;

  // ── Parallax ──
  function applyParallax(nx, ny) {
    bg.style.transform = `scale(1.19) translate(${nx*10}px,${ny*7}px)`;
    sw.style.transform = `translate(calc(-50% + ${nx*20}px), calc(-50% + ${ny*13}px))`;
  }
  phone.addEventListener('mousemove', e => {
    const r = phone.getBoundingClientRect();
    applyParallax(
      ((e.clientX - r.left) / r.width  - .5) * 2,
      ((e.clientY - r.top)  / r.height - .5) * 2
    );
  });
  phone.addEventListener('mouseleave', () => applyParallax(0, 0));
  phone.addEventListener('touchmove', e => {
    const t = e.touches[0], r = phone.getBoundingClientRect();
    applyParallax(
      ((t.clientX - r.left) / r.width  - .5) * 2,
      ((t.clientY - r.top)  / r.height - .5) * 2
    );
  }, { passive: true });

  // ── Button action ──
  function go(btn, msg) {
    const base = btn.style.transform || '';
    btn.style.transition = 'transform .15s';
    btn.style.transform  = base + ' scale(.86)';
    setTimeout(() => { btn.style.transform = base; btn.style.transition = ''; }, 200);
    spk(btn);
    clearTimeout(toastT);
    toast.textContent = msg;
    toast.classList.add('show');
    toastT = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function spk(btn) {
    const r  = btn.getBoundingClientRect();
    const pr = phone.getBoundingClientRect();
    const cx = r.left - pr.left + r.width  / 2;
    const cy = r.top  - pr.top  + r.height / 2;
    for (let i = 0; i < 8; i++) {
      const s = document.createElement('div');
      s.className = 'sp';
      const a = (i / 8) * Math.PI * 2;
      const d = 26 + Math.random() * 24;
      s.style.left = cx + 'px';
      s.style.top  = cy + 'px';
      s.style.setProperty('--sx', Math.cos(a) * d + 'px');
      s.style.setProperty('--sy', Math.sin(a) * d + 'px');
      s.style.background = `hsl(${35 + Math.random()*45},88%,65%)`;
      phone.appendChild(s);
      setTimeout(() => s.remove(), 700);
    }
  }
</script>
</body>
</html>
