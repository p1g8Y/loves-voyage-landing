<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>愛之航 · 航海日誌</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Playfair+Display:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#a8d4e8;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  font-family:'Noto Serif TC',serif;
}

/* ── Phone ── */
#phone{
  position:relative;
  width:min(390px,100vw);
  height:min(844px,calc(100vw * 16/9));
  max-height:100vh;
  border-radius:40px;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.1);
}

/* ── Ocean BG ── */
#bg{
  position:absolute;inset:0;
  background:url('./assets/bg_ocean_blur.png') center/cover no-repeat;
  transform:scale(1.04);
  filter:brightness(.85) saturate(.9);
}

/* ═══════════════════════════════════
   TOP BAR
═══════════════════════════════════ */
#topbar{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:12px 13px 0;z-index:20;
}
.hanging-sign{
  display:flex;flex-direction:column;align-items:flex-start;
}
.sign-img-wrap{
  position:relative;
  display:inline-block;
}
.ship-name-plate{
  position:absolute;
  left:60px;
  top:50%;
  transform:translateY(-50%);
  font-family:'Noto Serif TC',serif;
  font-size:.6rem;
  color:#fde8b0;
  letter-spacing:.1em;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
  white-space:nowrap;
  pointer-events:none;
  max-width:56px;
  overflow:hidden;
  text-overflow:ellipsis;
}
.hanging-sign-img{
  height:70px;object-fit:contain;
  filter:drop-shadow(0 5px 12px rgba(0,0,0,.35));
}
.hanging-sign-css{
  display:none;flex-direction:column;align-items:flex-start;
  filter:drop-shadow(0 5px 12px rgba(0,0,0,.35));
}
.sign-rods{display:flex;gap:40px;padding:0 11px;}
.sign-rod{width:3px;height:10px;background:linear-gradient(180deg,#4a280a,#c07840,#4a280a);border-radius:2px;}
.sign-body{display:flex;align-items:center;}
.medallion{
  width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 36% 33%,#e0b860 0%,#9a6028 55%,#5c3010 100%);
  border:3.5px solid #3d1e06;
  box-shadow:0 4px 12px rgba(0,0,0,.45),inset 0 2px 4px rgba(255,220,100,.3);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;
  position:relative;z-index:1;flex-shrink:0;
}
.medallion::before{content:'';position:absolute;inset:6px;border-radius:50%;border:1.5px solid rgba(255,220,100,.4);}
.plaque{
  background:linear-gradient(180deg,#d4a050 0%,#9a5e28 45%,#c09040 100%);
  border:2.5px solid #3d1e06;border-left:none;border-radius:0 10px 10px 0;
  padding:5px 14px 5px 16px;margin-left:-6px;
  box-shadow:3px 4px 10px rgba(0,0,0,.32),inset 0 1.5px rgba(255,255,255,.18);
  display:flex;align-items:center;min-width:88px;
}
.plaque-text{font-size:.72rem;color:#fde8b0;letter-spacing:.12em;text-shadow:0 1px 3px rgba(0,0,0,.55);white-space:nowrap;}
.coin-display{
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.32));margin-top:8px;
}
.coin-img-wrap{
  position:relative;
  display:inline-block;
}
.coin-bar-img{
  height:48px;
  width:auto;
  object-fit:contain;
  display:block;
}
.coin-num-overlay{
  position:absolute;
  right:15px;top:50%;
  transform:translateY(-50%);
  font-family:'Noto Serif TC',serif;
  font-size:.88rem;color:#5a2e0a;font-weight:700;letter-spacing:.04em;
  pointer-events:none;
  text-shadow:0 1px 3px rgba(255,255,255,.6);
}
.coin-fallback{
  display:none;align-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(248,238,215,.92));
  border:1.5px solid rgba(255,255,255,.95);border-radius:99px;
  padding:5px 13px;gap:5px;box-shadow:2px 3px 8px rgba(0,0,0,.2);
}
.coin-fallback .cn{font-size:.82rem;color:#5a2e0a;font-weight:700;}
.coin-fallback .cl{font-size:.6rem;color:#8a5820;letter-spacing:.05em;}

/* ═══════════════════════════════════
   PARCHMENT CARD  (compact height)
═══════════════════════════════════ */
#parchment{
  position:absolute;
  top:84px;left:10px;right:10px;bottom:48px;
  background:
    url('../../module1_main/assets/btn_journal.png') center/cover no-repeat,
    linear-gradient(160deg,#fef4e0 0%,#f2dca0 40%,#e8cc88 100%);
  background-blend-mode:soft-light;
  border-radius:20px;
  border:1.5px solid rgba(200,165,90,.45);
  box-shadow:0 14px 40px rgba(0,0,0,.28),inset 0 0 50px rgba(150,100,30,.07);
  display:flex;flex-direction:column;
  overflow:hidden;
}

/* ── Day nav arrows ── */
.day-arrow{
  position:absolute;
  top:50%;transform:translateY(-50%);
  z-index:25;
  width:28px;height:28px;
  background:rgba(255,248,225,.72);
  border:1.5px solid rgba(180,130,55,.35);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.18);
  backdrop-filter:blur(4px);
  transition:background .15s,transform .15s;
  font-size:.9rem;color:#7a4e18;
  user-select:none;
  /* vertically centered in the parchment zone (top:84px bottom:48px) */
  top:calc(84px + (100% - 84px - 48px) / 2);
}
.day-arrow:hover{background:rgba(230,190,90,.72);}
.day-arrow:active{background:rgba(200,150,50,.85);}
#arrow-prev{left:2px;}
#arrow-next{right:2px;}
#arrow-next.hidden,#arrow-prev.hidden{display:none;}

/* ── Botanical corner ── */
.bot{position:absolute;pointer-events:none;opacity:.22;}
.bot.tl{top:4px;left:4px;}
.bot.tr{top:4px;right:4px;transform:scaleX(-1);}
.bot.bl{bottom:4px;left:4px;transform:scaleY(-1);}
.bot.br{bottom:4px;right:4px;transform:scale(-1,-1);}

/* ── Scroll inner ── */
#inner{
  flex:1;overflow-y:hidden;padding:8px 14px 62px;
  scrollbar-width:none;
  display:flex;flex-direction:column;align-items:center;
}
#inner::-webkit-scrollbar{display:none;}

/* ── Date header ── */
.date-hd{text-align:center;margin-bottom:6px;}
.date-day{
  font-family:'Playfair Display',serif;
  font-size:1.25rem;color:#4a3010;letter-spacing:.04em;line-height:1;
}
.date-rule{
  text-align:center;
  margin:4px 0 0;
}
.date-rule::before,.date-rule::after{content:none;}
.date-rule span{font-size:.65rem;color:rgba(110,75,25,.55);letter-spacing:.15em;}
.date-rule span{font-size:.65rem;color:rgba(110,75,25,.55);letter-spacing:.2em;}

/* ═══════════════════════════════════
   MOOD SECTION  (long-press drag)
═══════════════════════════════════ */
.mood-section{
  width:100%;display:flex;justify-content:center;gap:22px;
  margin-bottom:6px;
}
.mood-col{display:flex;flex-direction:column;align-items:center;gap:2px;}

.mood-ring{
  width:66px;height:66px;border-radius:50%;
  background:rgba(255,250,232,.55);
  border:2.5px dashed rgba(110,75,25,.3);
  box-shadow:0 0 0 4px rgba(255,248,230,.4),0 0 0 6px rgba(110,75,25,.07),0 5px 14px rgba(0,0,0,.1);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  position:relative;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s;
  font-size:.62rem;color:rgba(110,75,25,.45);letter-spacing:.04em;
  user-select:none;-webkit-user-select:none;
  touch-action:none;
}
.mood-ring::before{content:'';position:absolute;inset:7px;border-radius:50%;border:1.5px solid rgba(110,75,25,.15);}
.mood-ring.picked{
  border-style:solid;border-color:rgba(180,120,40,.55);
  box-shadow:0 0 0 4px rgba(255,240,180,.5),0 0 0 6px rgba(180,120,40,.1),0 5px 18px rgba(0,0,0,.12);
}
.mood-ring .mood-img{width:42px;height:42px;object-fit:contain;pointer-events:none;}
.mood-ring .mood-emoji{font-size:2rem;line-height:1;pointer-events:none;}
.mood-ring .mood-placeholder{font-size:.58rem;color:rgba(110,75,25,.45);letter-spacing:.03em;text-align:center;line-height:1.3;pointer-events:none;}

.mood-lbl{font-size:.6rem;color:#8a6430;letter-spacing:.08em;}
.mood-hint{font-size:.52rem;color:rgba(110,75,25,.4);letter-spacing:.04em;}
/* 對方心情圓圈：唯讀樣式 */
.mood-ring.readonly{cursor:default;opacity:.72;border-style:solid;border-color:rgba(110,75,25,.18);}
.mood-ring.readonly::after{content:'🔒';position:absolute;bottom:1px;right:1px;font-size:.5rem;line-height:1;}

/* ═══════════════════════════════════
   MOOD PICKER POPUP
═══════════════════════════════════ */
#mood-picker{
  position:absolute;
  background:rgba(255,252,238,.97);
  border:1.5px solid rgba(160,110,40,.3);
  border-radius:18px;
  padding:8px 10px 10px;
  box-shadow:0 12px 32px rgba(0,0,0,.2),0 2px 8px rgba(0,0,0,.1);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  z-index:60;
  opacity:0;pointer-events:none;
  transform:scale(.82) translateY(8px);
  transition:opacity .18s,transform .22s cubic-bezier(.34,1.56,.64,1);
}
#mood-picker.show{opacity:1;pointer-events:all;transform:scale(1) translateY(0);}
.mp-title{font-size:.58rem;color:rgba(110,75,25,.5);letter-spacing:.12em;}
.mp-row{display:flex;gap:6px;}
.mp-opt{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 7px;border-radius:12px;
  cursor:pointer;
  transition:background .15s,transform .15s;
  touch-action:none;
}
.mp-opt img{width:40px;height:40px;object-fit:contain;pointer-events:none;}
.mp-opt span{font-size:.58rem;color:#7a5020;pointer-events:none;}
.mp-opt.hl{background:rgba(180,120,40,.18);transform:scale(1.14);}
.mp-opt:hover{background:rgba(180,120,40,.12);}

/* ── Daily Event divider ── */
.event-divider{
  width:100%;display:flex;align-items:center;gap:7px;
  margin:0 0 6px;
}
.event-divider .line{flex:1;height:1px;background:rgba(110,75,25,.22);}
.event-divider span{font-size:.68rem;color:#7a5830;letter-spacing:.18em;white-space:nowrap;}
.event-divider .star{color:rgba(110,75,25,.4);font-size:.68rem;}

/* ── Whale trigger row ── */
.whale-row{
  width:100%;display:flex;align-items:center;gap:8px;
  margin-bottom:6px;
}
.whale-ask-btn{
  display:flex;align-items:center;gap:6px;
  background:rgba(200,230,255,.45);
  border:1px solid rgba(80,140,200,.3);border-radius:99px;
  padding:4px 12px 4px 6px;cursor:pointer;
  transition:transform .2s,background .2s;
  font-size:.68rem;color:#3a6888;letter-spacing:.07em;
}
.whale-ask-btn img{width:30px;height:30px;object-fit:contain;flex-shrink:0;}
.whale-ask-btn:hover{background:rgba(180,215,255,.55);transform:scale(1.02);}
.whale-ask-btn:active{transform:scale(.95);}

/* 對方文字框：唯讀樣式 */
.jtextarea.readonly{
  background:rgba(235,225,200,.38);
  color:rgba(60,36,8,.72);
  cursor:default;
  border-color:rgba(130,90,30,.14);
  pointer-events:none;
  user-select:none;
  transition:none;
}
.jtextarea.readonly:focus{
  border-color:rgba(130,90,30,.14);
  box-shadow:none;
}
/* ── Journal text boxes ── */
.jbox{width:100%;margin-bottom:10px;flex:1 1 0;min-height:0;display:flex;flex-direction:column;}
.jbox-label{
  display:flex;align-items:center;gap:5px;
  font-size:.62rem;color:#8a6430;letter-spacing:.12em;margin-bottom:3px;
}
.jbox-label::before{content:'✦';font-size:.5rem;color:rgba(130,90,40,.5);}
.jtextarea{
  width:100%;
  background:rgba(255,250,230,.55);
  border:1.5px solid rgba(130,90,30,.22);
  border-radius:12px;
  padding:7px 11px;
  font-family:'Noto Serif TC',serif;
  font-size:.78rem;color:#3c2408;line-height:1.6;
  resize:none;outline:none;
  flex:1;min-height:0;
  transition:border-color .2s,box-shadow .2s;
}
.jtextarea:focus{border-color:rgba(130,90,30,.5);box-shadow:0 0 0 3px rgba(180,130,60,.12);}
.jtextarea::placeholder{color:#b89870;}
.jtextarea.partner-area{background:rgba(245,235,210,.48);}
.jtextarea.my-area{}
.char-count{text-align:right;font-size:.56rem;color:#a07850;margin-top:2px;}

/* ── Submit button ── */
.submit-area{
  position:absolute;bottom:-15px;left:0;right:0;
  display:flex;justify-content:center;
}
.submit-btn{
  background:transparent;border:none;cursor:pointer;padding:0;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),filter .15s;
}
.submit-btn img{width:112px;object-fit:contain;filter:drop-shadow(0 5px 14px rgba(180,90,40,.3));}
.submit-btn:active{transform:scale(.91);filter:brightness(.84);}
.submit-css{
  display:none;
  background:linear-gradient(135deg,#d48048,#a85020);
  border:2px solid rgba(255,220,160,.5);border-radius:20px;
  padding:10px 32px;color:#fde8c0;font-size:.86rem;letter-spacing:.14em;
  box-shadow:0 6px 18px rgba(180,80,40,.3);cursor:pointer;
  font-family:'Noto Serif TC',serif;transition:transform .15s;
}
.submit-css:active{transform:scale(.93);}

/* ── Success overlay ── */
#success{
  position:absolute;inset:0;border-radius:40px;
  background:radial-gradient(ellipse at 50% 40%,rgba(255,250,225,.96),rgba(248,230,165,.92));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  opacity:0;pointer-events:none;transition:opacity .4s;z-index:50;
}
#success.show{opacity:1;pointer-events:all;}
.suc-icon{font-size:3.5rem;animation:popIn .5s cubic-bezier(.34,1.56,.64,1);}
.suc-msg{font-size:.95rem;color:#5a3e20;font-style:italic;letter-spacing:.08em;}
.suc-sub{font-size:.7rem;color:#8a6a40;letter-spacing:.12em;}
@keyframes popIn{0%{transform:scale(0) rotate(-20deg);}100%{transform:scale(1);}}

/* ── 默契繩結增加動畫 ── */
#bond-popup{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0);
  z-index:80;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  pointer-events:none;
  opacity:0;
  transition:none;
  background:rgba(255,255,255,.5);
  border-radius:24px;
  padding:18px 28px 14px;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
#bond-popup.show{
  animation:bondPop .6s cubic-bezier(.34,1.56,.64,1) forwards, bondFade 2.8s ease forwards;
}
@keyframes bondPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(-10deg);}
  60%{opacity:1;transform:translate(-50%,-65%) scale(1.12) rotate(3deg);}
  100%{opacity:1;transform:translate(-50%,-65%) scale(1) rotate(0deg);}
}
@keyframes bondFade{
  0%,55%{opacity:1;}
  85%{opacity:0;}
  100%{opacity:0;}
}
.bond-knot{width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(180,100,20,.45));}
.bond-gain{
  font-family:'Noto Serif TC',serif;
  font-size:1.3rem;font-weight:700;
  color:#c06010;
  text-shadow:0 2px 8px rgba(255,200,80,.7),0 0 20px rgba(255,180,40,.5);
  letter-spacing:.06em;
}
.bond-label{font-size:.62rem;color:#8a5820;letter-spacing:.14em;}

/* ── 默契數字 bump 動畫 ── */
@keyframes coinBump{
  0%{transform:translateY(-50%) scale(1);}
  40%{transform:translateY(-60%) scale(1.35);}
  70%{transform:translateY(-50%) scale(.92);}
  100%{transform:translateY(-50%) scale(1);}
}
.coin-num-overlay.bump{animation:coinBump .45s cubic-bezier(.34,1.56,.64,1);}

.par{
  position:absolute;pointer-events:none;
  width:7px;height:7px;border-radius:50%;
  animation:parA .85s ease-out forwards;z-index:60;
}
@keyframes parA{
  0%{opacity:1;transform:translate(0,0) scale(1);}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0);}
}

/* ── 第幾天 + 今天按鈕（定位相對於 #parchment） ── */
#day-indicator{
  position:absolute;bottom:14px;left:16px;
  font-family:'Noto Serif TC',serif;
  font-size:.72rem;color:rgba(100,65,18,.6);
  letter-spacing:.1em;
  z-index:25;
  pointer-events:none;
}
#today-btn{
  position:absolute;bottom:10px;right:14px;
  background:rgba(200,155,60,.18);
  border:1.5px solid rgba(160,110,40,.35);
  border-radius:99px;
  padding:4px 13px;
  font-family:'Noto Serif TC',serif;
  font-size:.65rem;color:#7a4e18;letter-spacing:.08em;
  cursor:pointer;z-index:25;
  transition:background .15s;
}
#today-btn:hover{background:rgba(200,155,60,.32);}
#today-btn:active{background:rgba(180,120,30,.45);}
#today-btn.hidden{display:none;}

/* ═══════════════════════════════════
   WHALE Q&A MODAL
═══════════════════════════════════ */
#whale-qa-modal{
  position:absolute;inset:0;
  background:rgba(28,16,6,.58);
  backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;
  z-index:70;
  opacity:0;pointer-events:none;
  transition:opacity .28s;
}
#whale-qa-modal.show{opacity:1;pointer-events:all;}
#whale-qa-box{
  width:84%;max-width:308px;
  background:linear-gradient(160deg,#fef5e2 0%,#f2daaa 100%);
  border:2px solid rgba(180,130,55,.38);
  border-radius:24px;
  padding:18px 18px 16px;
  box-shadow:0 22px 55px rgba(0,0,0,.38);
  display:flex;flex-direction:column;align-items:center;gap:10px;
  transform:scale(.88) translateY(24px);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
#whale-qa-modal.show #whale-qa-box{transform:scale(1) translateY(0);}
.wqa-whale-icon img{width:56px;height:56px;object-fit:contain;}
.wqa-whale-icon .wqa-emoji{font-size:2.6rem;}
.wqa-label{font-size:.6rem;color:rgba(110,75,25,.55);letter-spacing:.15em;}
.wqa-question{
  font-size:.88rem;color:#3c2408;
  text-align:center;line-height:1.65;font-weight:600;
  padding:0 4px;
}
.wqa-textarea{
  width:100%;
  background:rgba(255,252,240,.85);
  border:1.5px solid rgba(130,90,30,.28);
  border-radius:12px;
  padding:9px 12px;
  font-family:'Noto Serif TC',serif;
  font-size:.82rem;color:#3c2408;line-height:1.65;
  resize:none;min-height:68px;outline:none;
  transition:border-color .2s;
}
.wqa-textarea:focus{border-color:rgba(130,90,30,.55);}
.wqa-textarea::placeholder{color:#b89870;}
.wqa-btns{display:flex;gap:9px;width:100%;}
.wqa-skip{
  flex:1;padding:9px;white-space:nowrap;
  background:rgba(0,0,0,.06);
  border:1.5px solid rgba(0,0,0,.1);
  border-radius:12px;color:#8a6430;
  font-family:'Noto Serif TC',serif;font-size:.78rem;cursor:pointer;
  transition:background .15s;
}
.wqa-skip:hover{background:rgba(0,0,0,.1);}
.wqa-submit-btn{
  flex:2;padding:9px;
  background:linear-gradient(135deg,#c87030,#8a4818);
  border:none;border-radius:12px;
  color:#fde8b0;
  font-family:'Noto Serif TC',serif;font-size:.78rem;cursor:pointer;
  box-shadow:0 5px 14px rgba(180,80,30,.28);
  transition:transform .15s,filter .15s;
}
.wqa-submit-btn:active{transform:scale(.94);filter:brightness(.9);}
</style>
</head>
<body>
<div id="phone">

  <div id="bg"></div>

  <!-- Top Bar -->
  <div id="topbar">
    <div class="hanging-sign">
      <div class="sign-img-wrap">
        <img class="hanging-sign-img"
             src="../../shared_assets/木頭懸掛招牌.png" alt="航海日誌"
             onerror="this.style.display='none';this.parentElement.nextElementSibling.style.display='flex'">
        <span class="ship-name-plate">愛的小船</span>
      </div>
      <div class="hanging-sign-css">
        <div class="sign-rods"><div class="sign-rod"></div><div class="sign-rod"></div></div>

  /* ═══ renderDay ═══ */
  function renderDay() {
    const d = new Date();
    d.setDate(d.getDate() + dayOffset);
    const dn = d.getDate();
    const sfx = [,'st','nd','rd'][dn % 10] || 'th';
    document.getElementById('date-display').textContent = months[d.getMonth()] + ' ' + dn + sfx;
    document.getElementById('day-display').textContent  = days[d.getDay()];

    // 箭頭：到底/到頂時隱藏
    document.getElementById('arrow-next').classList.toggle('hidden', dayOffset === 0);
    document.getElementById('arrow-prev').classList.toggle('hidden', dayOffset === MIN_DAY);

    // 第幾天 & 今天按鈕
    document.getElementById('day-number').textContent = dayOffset - MIN_DAY + 1;
    document.getElementById('today-btn').classList.toggle('hidden', dayOffset === 0);

    // 取資料
    const data = journalData[String(dayOffset)] || journalData[dayOffset] || { partnerAns:'', partnerMoodIdx:null, myAns:'', myMoodIdx:null };

    // 對方回答
    document.getElementById('partner-ans').value = data.partnerAns || '';
    if (data.partnerMoodIdx !== null && data.partnerMoodIdx !== undefined) {
      applyMood('partner', data.partnerMoodIdx);
    } else {
      moodState.partner = null;
      const rp = document.getElementById('ring-partner');
      rp.innerHTML = '<div class="mood-placeholder">等待<br>夥伴</div>';
      rp.classList.remove('picked');
    }

    const isToday = dayOffset === 0;
    const myAnsEl = document.getElementById('my-ans');

    // 玩家對話框
    myAnsEl.readOnly = !isToday;
    myAnsEl.classList.toggle('readonly', !isToday);

    // 歷史頁：隱藏小鯨魚、送出、字數、長按提示；鎖定我的心情圈游標
    document.querySelector('.submit-area').style.display  = isToday ? '' : 'none';
    document.querySelector('.whale-row').style.display    = isToday ? '' : 'none';
    document.querySelector('.char-count').style.display   = isToday ? '' : 'none';
    document.getElementById('me-mood-hint').style.display = isToday ? '' : 'none';
    const ringMe = document.getElementById('ring-me');
    ringMe.style.cursor = isToday ? '' : 'default';

    if (!isToday) {
      myAnsEl.value = data.myAns || '';
      if (data.myMoodIdx !== null && data.myMoodIdx !== undefined) {
        applyMood('me', data.myMoodIdx);
      } else {
        moodState.me = null;
        const rm = document.getElementById('ring-me');
        rm.innerHTML = '<div class="mood-placeholder">長按<br>選心情</div>';
        rm.classList.remove('picked');
      }
    } else {
      myAnsEl.value = '';
      updateCC();
      moodState.me = null;
      const rm = document.getElementById('ring-me');
      rm.innerHTML = '<div class="mood-placeholder">長按<br>選心情</div>';
      rm.classList.remove('picked');
    }
  }

  const MIN_DAY = -6; // 最早有紀錄的那天

  function goToToday() {
    dayOffset = 0;
    renderDay();
  }

  function changeDay(delta) {
    const next = dayOffset + delta;
    if (next > 0 || next < MIN_DAY) return;
    dayOffset = next;
    renderDay();
  }

  /* ═══════════════════════════════════
     MOOD — long-press drag picker
  ═══════════════════════════════════ */
  const MOODS = [
    { img:'開心太陽.png', label:'開心', emoji:'☀️' },
    { img:'平靜白雲.png', label:'平靜', emoji:'⛅' },
    { img:'憂鬱烏雲.png', label:'憂鬱', emoji:'🌧' },
    { img:'生氣雷雲.png', label:'生氣', emoji:'⛈' },
  ];

  const moodState = { me: null, partner: null };
  let lpTimer = null, lpActive = false, lpWho = null, lpHl = -1;
  const picker = document.getElementById('mood-picker');
  const mpOpts = picker.querySelectorAll('.mp-opt');

  function mdDown(who, e) {
    if (dayOffset !== 0) return; // 歷史頁不能改心情
    e.currentTarget.setPointerCapture(e.pointerId);
    lpWho = who; lpActive = false; lpHl = -1;
    lpTimer = setTimeout(() => {
      lpActive = true;
      positionPicker(who);
      picker.classList.add('show');
      if (navigator.vibrate) navigator.vibrate(12);
    }, 380);
  }

  function mdMove(e) {
    if (!lpActive) return;
    const r = picker.getBoundingClientRect();
    const pr = document.getElementById('phone').getBoundingClientRect();
    const cx = e.clientX, cy = e.clientY;
    let best = -1, bestD = 999;
    mpOpts.forEach((o, i) => {
      const or = o.getBoundingClientRect();
      const d = Math.hypot(cx - (or.left + or.width/2), cy - (or.top + or.height/2));
      if (d < bestD) { bestD = d; best = i; }
    });
    if (best !== lpHl) {
      mpOpts.forEach(o => o.classList.remove('hl'));
      if (best >= 0) mpOpts[best].classList.add('hl');
      lpHl = best;
    }
  }

  function mdUp(e) {
    clearTimeout(lpTimer);
    if (lpActive) {
      picker.classList.remove('show');
      mpOpts.forEach(o => o.classList.remove('hl'));
      if (lpHl >= 0) applyMood(lpWho, lpHl);
    }
    lpActive = false; lpHl = -1;
  }

  // Also allow direct tap on mp-opt (for mouse/desktop)
  mpOpts.forEach(o => {
    o.addEventListener('click', () => {
      if (lpWho) { applyMood(lpWho, parseInt(o.dataset.idx)); picker.classList.remove('show'); }
    });
  });

  function positionPicker(who) {
    const ring = document.getElementById('ring-' + who);
    const rr = ring.getBoundingClientRect();
    const pr = document.getElementById('phone').getBoundingClientRect();
    const top  = Math.max(8, rr.top - pr.top - 110);
    const left = Math.max(8, rr.left - pr.left - 60);
    picker.style.top  = top  + 'px';
    picker.style.left = left + 'px';
  }

  function applyMood(who, idx) {
    const m = MOODS[idx];
    moodState[who] = idx;
    const ring = document.getElementById('ring-' + who);
    ring.classList.add('picked');
    ring.innerHTML = `<img class="mood-img" src="../../../圖/天氣/${m.img}"
      onerror="this.outerHTML='<span class=mood-emoji>${m.emoji}</span>'">`;
  }

  /* ═══════════════════════════════════
     WHALE Q&A
  ═══════════════════════════════════ */
  const Qs = [
    '今天最感謝對方的一件事是什麼？',
    '如果今天的心情是一種天氣，你覺得是哪種？',
    '什麼事讓你覺得你們越來越有默契？',
    '今天你最想對對方做的一件溫柔的事？',
    '如果今天是旅程中的某片海域，是什麼感覺？',
    '有什麼還沒說出口的話嗎？',
    '一件想和對方一起完成的事是什麼？',
  ];

  let currentQ = '';

  function openWhaleQA() {
    const myAns = document.getElementById('my-ans');
    if (myAns.value.trim()) {
      myAns.style.boxShadow = '0 0 0 3px rgba(180,130,60,.35)';
      myAns.scrollIntoView({ behavior:'smooth', block:'center' });
      setTimeout(() => myAns.style.boxShadow = '', 1000);
      return;
    }
    document.getElementById('wqa-confirm').style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;';
    document.getElementById('wqa-main').style.display = 'none';
    document.getElementById('whale-qa-modal').classList.add('show');
  }

  function confirmNoShare() {
    currentQ = Qs[Math.floor(Math.random() * Qs.length)];
    document.getElementById('wqa-question').textContent = currentQ;
    document.getElementById('wqa-answer').value = '';
    document.getElementById('wqa-confirm').style.display = 'none';
    document.getElementById('wqa-main').style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;';
    setTimeout(() => document.getElementById('wqa-answer').focus(), 200);
  }

  function submitWhaleQA() {
    const answer = document.getElementById('wqa-answer').value.trim();
    if (!answer) {
      const ta = document.getElementById('wqa-answer');
      ta.style.borderColor = 'rgba(200,80,40,.55)';
      setTimeout(() => ta.style.borderColor = '', 700);
      return;
    }
    const myAns = document.getElementById('my-ans');
    const existing = myAns.value.trim();
    const entry = `問：${currentQ}\n答：${answer}`;
    myAns.value = existing ? existing + '\n\n' + entry : entry;
    updateCC();
    closeWhaleQA();
    setTimeout(() => myAns.scrollIntoView({ behavior:'smooth', block:'center' }), 200);
  }

  function closeWhaleQA() {
    document.getElementById('whale-qa-modal').classList.remove('show');
  }

  function onQAModalBg(e) {
    if (e.target === document.getElementById('whale-qa-modal')) closeWhaleQA();
  }

  /* ── Char count ── */
  function updateCC() {
    document.getElementById('cc').textContent =
      document.getElementById('my-ans').value.length;
  }

  /* ═══════════════════════════════════
     默契值系統
  ═══════════════════════════════════ */
  let coinValue = 128;
  const todayKey = 'journalSubmitDate_' + new Date().toDateString();
  let submittedToday = sessionStorage.getItem(todayKey) === '1';

  function updateCoinDisplay(val) {
    document.querySelector('.coin-num-overlay').textContent = val;
    document.querySelector('.coin-fallback .cn').textContent = val;
  }

  function animateCoinBump() {
    const el = document.querySelector('.coin-num-overlay');
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
    el.addEventListener('animationend', () => el.classList.remove('bump'), { once: true });
  }

  function showBondPopup(gain) {
    const popup = document.getElementById('bond-popup');
    document.getElementById('bond-gain-text').textContent = '+' + gain;
    popup.classList.remove('show');
    void popup.offsetWidth;
    popup.classList.add('show');
  }

  function animateCoinCount(from, to) {
    const dur = 600, steps = 20;
    let step = 0;
    const interval = setInterval(() => {
      step++;
      updateCoinDisplay(Math.round(from + (to - from) * (step / steps)));
      if (step >= steps) { clearInterval(interval); updateCoinDisplay(to); }
    }, dur / steps);
  }

  /* ── Submit ── */
  const suc = document.getElementById('success');
  function doSubmit() {
    const ta = document.getElementById('my-ans');
    if (!ta.value.trim() && moodState.me === null) {
      ta.style.borderColor = 'rgba(200,80,40,.5)';
      setTimeout(() => ta.style.borderColor = '', 800);
      return;
    }
    const gain = submittedToday ? 5 : 20;
    const newCoin = coinValue + gain;
    spawnParticles();
    suc.classList.add('show');
    setTimeout(() => {
      suc.classList.remove('show');
      showBondPopup(gain);
      animateCoinBump();
      animateCoinCount(coinValue, newCoin);
      coinValue = newCoin;
      submittedToday = true;
      sessionStorage.setItem(todayKey, '1');
      document.getElementById('partner-ans').value = '今天過得好嗎？想跟你分享一下我今天主要都在處理一些比較瑣碎的日常工作，下午還趁著空檔把房間稍微整理了一下，換了個心情。雖然大部分時間都專注在手邊的事情上，但只要稍微停下來喝口水、喘口氣，腦海裡就會浮現你。今天整體感覺挺充實平靜的，你呢？今天有沒有遇到什麼特別、或者想跟我說的事情？';
      applyMood('partner', 1);
    }, 1000);
  }

  function spawnParticles() {
    const btn = document.querySelector('.submit-area');
    const r   = btn.getBoundingClientRect();
    const pr  = document.getElementById('phone').getBoundingClientRect();
    const cx  = r.left - pr.left + r.width / 2;
    const cy  = r.top  - pr.top  + r.height / 2;
    const cols = ['#ffd98a','#ff9a7a','#c3e0ff','#ffc2db','#a8edca'];
    for (let i = 0; i < 12; i++) {
      const p = document.createElement('div');
      p.className = 'par';
      const a = (i / 12) * Math.PI * 2, dv = 38 + Math.random() * 38;
      p.style.left = cx + 'px'; p.style.top = cy + 'px';
      p.style.setProperty('--dx', Math.cos(a) * dv + 'px');
      p.style.setProperty('--dy', Math.sin(a) * dv + 'px');
      p.style.background = cols[i % cols.length];
      document.getElementById('phone').appendChild(p);
      setTimeout(() => p.remove(), 850);
    }
  }

  // ── 初始化 ──
  renderDay();

</script>
</body>
</html>
